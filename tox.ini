[tox]
isolated_build = True
envlist =
    lint
    typecheck
    py310-django{42,52}
    py311-django{42,52}
    py312-django{42,52}
    py313-django{52,60}
    py314-django60
    coverage

[testenv]
extras =
    dev
    test
    demo
deps =
    django42: Django>=4.2,<4.3
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
commands =
    pytest {posargs}

[testenv:lint]
skip_install = true
deps =
    ruff>=0.6
    flake8>=7
commands =
    ruff check .
    ruff format --check .
    flake8 dbmail

[testenv:typecheck]
extras = dev
deps =
    Django>=6.0,<6.1
commands =
    mypy dbmail

[testenv:coverage]
extras =
    dev
    test
    demo
deps =
    Django>=6.0,<6.1
commands =
    pytest --cov=dbmail --cov-report=xml --cov-report=term-missing {posargs}
