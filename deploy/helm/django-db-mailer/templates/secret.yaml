{{- if not .Values.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dbmail.fullname" . }}-secret
  labels:
    {{- include "dbmail.labels" . | nindent 4 }}
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ .Values.secret.DJANGO_SECRET_KEY | quote }}
  DATABASE_URL: {{ .Values.secret.DATABASE_URL | quote }}
  CELERY_BROKER_URL: {{ .Values.secret.CELERY_BROKER_URL | quote }}
  CELERY_RESULT_BACKEND: {{ .Values.secret.CELERY_RESULT_BACKEND | quote }}
  DBMAIL_API_HMAC_SECRET: {{ .Values.secret.DBMAIL_API_HMAC_SECRET | quote }}
{{- end -}}
