apiVersion: v1
kind: Service
metadata:
  name: {{ include "dbmail.fullname" . }}-web
  labels:
    {{- include "dbmail.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "dbmail.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    role: web
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
