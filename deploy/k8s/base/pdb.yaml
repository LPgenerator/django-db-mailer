apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dbmail-web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: dbmail, role: web }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dbmail-worker
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: dbmail, role: worker }
