apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbmail-web
  labels:
    app: dbmail
    role: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dbmail
      role: web
  template:
    metadata:
      labels:
        app: dbmail
        role: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/lpgenerator/django-db-mailer-demo:3.0.0
          imagePullPolicy: IfNotPresent
          command: ["gunicorn"]
          args:
            - "demo.wsgi:application"
            - "--chdir=demo"
            - "--bind=0.0.0.0:8000"
            - "--workers=4"
            - "--threads=2"
            - "--timeout=30"
            - "--access-logfile=-"
            - "--error-logfile=-"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: dbmail-config }
            - secretRef: { name: dbmail-secret }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /admin/login/, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /admin/login/, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            httpGet: { path: /admin/login/, port: http }
            failureThreshold: 30
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: media, mountPath: /app/media }
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: media
          persistentVolumeClaim: { claimName: dbmail-media }
