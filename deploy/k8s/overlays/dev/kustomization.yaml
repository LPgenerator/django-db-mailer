apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dbmail-dev

resources:
  - ../../base

patches:
  - path: patch-replicas.yaml
  - path: patch-debug-config.yaml

configMapGenerator:
  - name: dbmail-config
    behavior: merge
    literals:
      - DJANGO_DEBUG=1
      - DJANGO_ALLOWED_HOSTS=*
