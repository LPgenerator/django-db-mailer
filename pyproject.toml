[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata (PEP 621)
# ---------------------------------------------------------------------------

[project]
name = "django-db-mailer"
description = "Django module to easily send emails/SMS/push/TTS/bot messages using templates stored in a database."
readme = { file = "README.md", content-type = "text/markdown" }
keywords = [
    "django",
    "db",
    "mail",
    "email",
    "html",
    "text",
    "tts",
    "sms",
    "push",
    "templates",
    "mailer",
]
authors = [
    { name = "GoTLiuM InSPiRiT", email = "gotlium@gmail.com" },
]
maintainers = [
    { name = "GoTLiuM InSPiRiT", email = "gotlium@gmail.com" },
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License (GPL)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version"]

dependencies = [
    "Django>=4.2,<7.0",
    "django-ipware>=7.0,<8",
]

[project.urls]
Homepage = "https://github.com/LPgenerator/django-db-mailer"
Repository = "https://github.com/LPgenerator/django-db-mailer"
Issues = "https://github.com/LPgenerator/django-db-mailer/issues"
Changelog = "https://github.com/LPgenerator/django-db-mailer/blob/master/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Optional dependencies (pip install "django-db-mailer[dev,test,demo]")
# ---------------------------------------------------------------------------

[project.optional-dependencies]

# Linters, type-checkers, security scanners, packaging.
dev = [
    "ruff>=0.6",
    "flake8>=7",
    "mypy>=1.10",
    "django-stubs[compatible-mypy]>=5.0",
    "bandit[toml]>=1.7",
    "pre-commit>=3.7",
    "build>=1.2",
    "twine>=5.1",
]

# Test stack: pytest + factories + HTTP mocks + migration tests + property-based.
test = [
    "pytest>=8",
    "pytest-django>=4.8",
    "pytest-cov>=5",
    "pytest-mock>=3.14",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "responses>=0.25",
    "respx>=0.21",
    "django-test-migrations>=1.4",
    "hypothesis>=6.108",
    "diff-cover>=9",
]

# Sphinx + MyST + Furo theme.
docs = [
    "Sphinx>=7",
    "myst-parser>=3",
    "furo>=2024.5.6",
    "sphinx-copybutton>=0.5",
    "sphinxext-opengraph>=0.9",
]

# Demo project — historical set of admin extensions.
demo = [
    "celery[redis]>=5.4",
    "redis>=5",
    "psycopg[binary]>=3.3.4",
    "django-grappelli>=4.0",
    "django-ckeditor>=6.7",
    "django-reversion>=5.1",
    "django-reversion-compare>=0.16",
    "diff-match-patch>=20241021",
    "django-tinymce>=4.1",
    "django-debug-toolbar>=4.4",
    "django-extensions>=3.2",
    "Werkzeug>=3",
    "ipython>=8",
    "django-rosetta>=0.10",
    "django-redis>=5.4",
    "dj-database-url>=2.2",
    "whitenoise>=6.7",
]

# Celery integration (optional at runtime).
celery = ["celery[redis]>=5.4"]

# Jinja2 sandbox renderer (DB_MAILER_USE_JINJA2_SANDBOX=True). Mitigates
# SSTI via the default Django template engine — see dbmail/safe_template.py.
sandbox = ["jinja2>=3.1"]

# Per-provider extras. SDKs are imported lazily inside send().
apns = ["httpx[http2]>=0.27", "pyjwt[crypto]>=2.8"]
fcm = ["google-auth>=2.30", "requests>=2.32"]
twilio = ["twilio>=9"]
pubnub = ["pubnub>=7"]
vonage = ["vonage>=3"]
brevo = ["getbrevo-brevo-python>=1"]
sendinblue = ["mailin>=1"]
webpush = ["pywebpush>=2"]

# HTML email enrichment (premailer inlines CSS, html2text generates the
# plaintext alternative for HTML templates).
html = ["html2text>=2024", "premailer>=3.10"]

# Email open-tracking enrichment (User-Agent parser populates
# MailLogTrack.os/browser/device).
tracking = ["httpagentparser>=1.9"]

# Convenience meta-extra: every optional provider SDK at once.
all-providers = [
    "httpx[http2]>=0.27",
    "pyjwt[crypto]>=2.8",
    "google-auth>=2.30",
    "requests>=2.32",
    "twilio>=9",
    "pubnub>=7",
    "vonage>=3",
    "getbrevo-brevo-python>=1",
    "pywebpush>=2",
]

# ---------------------------------------------------------------------------
# Setuptools build configuration
# ---------------------------------------------------------------------------

[tool.setuptools.dynamic]
version = { attr = "dbmail.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["dbmail*"]
exclude = ["demo*", "tests*", "docs*", "screenshots*"]

# Package data is shipped both via [tool.setuptools.package-data] (wheels)
# and via MANIFEST.in (sdists). Both are kept in sync.
[tool.setuptools.package-data]
dbmail = [
    "locale/*/LC_MESSAGES/*.po",
    "locale/*/LC_MESSAGES/*.mo",
    "fixtures/*.json",
    "static/dbmail/admin/js/*.js",
    "templates/**/*.html",
    "templates/**/*.txt",
]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter, replaces black/isort/flake8 partially)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["dbmail"]
extend-exclude = [
    "dbmail/migrations",
    "dbmail/locale",
    "dbmail/fixtures",
    "demo/demo/migrations",
    "docs/_build",
    "docs/legacy",
    "build",
    "dist",
    ".tox",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "DJ",  # flake8-django
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line too long (formatter handles it)
    "B008",   # do not perform function calls in argument defaults (Django uses this everywhere)
    "B904",   # raise without from inside except
    "S101",   # use of assert (allowed in tests)
    "S301",   # pickle.loads — flagged separately on a case-by-case basis (legacy data, removed in 4.0)
    "S308",   # mark_safe is fine for trusted templates
    "DJ001",  # nullable CharField — Django conventional in many places
    "DJ008",  # __str__ recommendation (cosmetics)
    "DJ012",  # Django model body content order (cosmetic, legacy code)
    "RUF001", # ambiguous unicode (Cyrillic in user-visible strings)
    "RUF002",
    "RUF003",
    "RUF012", # mutable class default — Django attrs (`fields = [...]`) trigger this everywhere
    "UP031",  # printf-style formatting — legacy idiom across providers; not introducing new
    "C408",   # `dict()` vs `{}` — author preference
]

[tool.ruff.lint.per-file-ignores]
"dbmail/test_cases.py" = ["S", "B"]
"tests/**/*.py" = ["S", "B", "DJ", "RUF059"]
"demo/**/*.py" = ["S105", "S106", "DJ"]
"dbmail/__init__.py" = ["F401", "RUF005"]
"dbmail/providers/__init__.py" = ["F401"]
# Providers hit external services — the loop-variable shadowing, urlopen,
# and try/except-pass patterns predate this codebase and are not introducing
# new risk. Each suppression is reviewed when the provider is touched.
"dbmail/providers/**/*.py" = ["B020", "S110", "S113", "S310", "F401", "B905", "C414", "RUF005", "RUF021"]
"dbmail/management/commands/send_dbmail_deferred_signal.py" = ["B020"]
"dbmail/backends/mail.py" = ["B020"]
"dbmail/fields.py" = ["F401"]
"dbmail/signals.py" = ["B020"]
"dbmail/models.py" = ["B905", "E731"]
"dbmail/defaults.py" = ["C414"]
"docs/conf.py" = ["S110"]

[tool.ruff.lint.isort]
known-first-party = ["dbmail"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
plugins = ["mypy_django_plugin.main"]
files = ["dbmail"]
exclude = "(dbmail/migrations|dbmail/test_cases.py|demo)"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
# Start at low strictness; ratchet up after phases 03/04.
strict = false
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "demo.demo.settings"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: unit tests, no DB",
    "integration: tests that hit the DB",
    "slow: tests > 1s",
]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    # Точечные исключения для чужих библиотек добавляем по мере появления.
    "ignore::DeprecationWarning:celery.*",
    "ignore::DeprecationWarning:kombu.*",
    # Опт-ин deprecation у наших EOL-провайдеров: они
    # сознательно эмитят DeprecationWarning при первом send() и должны
    # тестироваться без падения test runner. Match по message — в
    # коде стоит ``stacklevel=2``, поэтому module-фильтр указывает
    # на caller, а не на dbmail.providers.*.
    "ignore:dbmail\\.providers\\..*deprecated:DeprecationWarning",
    "ignore:dbmail\\.providers\\.google\\.android targets:DeprecationWarning",
    "ignore:dbmail\\.providers\\.sendinblue uses:DeprecationWarning",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["dbmail"]
omit = [
    "dbmail/migrations/*",
    "dbmail/test_cases.py",
    "dbmail/providers/__init__.py",
    "dbmail/translation.py",
    "dbmail/providers/parse_com/*",
    "dbmail/providers/boxcar/*",
    "dbmail/providers/apple/apns.py",
    "dbmail/providers/pubnub/*",
]

[tool.coverage.report]
# Coverage floor ratchet — lifted during the 3.0 modernisation.
# Two points of slack are reserved for legacy provider edges.
#   3.0.0  →  82   (this release)
#   3.1.0  →  88
#   3.2.0  →  92
#   3.3.0  →  95
# diff-cover requires 100% coverage of *new* code on every PR.
fail_under = 82
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

# ---------------------------------------------------------------------------
# Bandit (security)
# ---------------------------------------------------------------------------

[tool.bandit]
exclude_dirs = ["tests", "demo", "dbmail/migrations", ".tox", ".venv", "build"]
skips = [
    "B101", # assert (tests)
]
