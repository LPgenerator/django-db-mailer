# Pre-commit configuration for django-db-mailer.
# Install:   pip install -r requirements.dev.txt && pre-commit install
# Run:       pre-commit run --all-files
#
# mypy, semgrep, pip-audit and pytest are NOT here on purpose — they belong
# in CI / Docker (Makefile targets), not in every git commit.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types: [python]
        require_serial: true

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: ['--config', '.markdownlint.json']
        exclude: '^docs/legacy/'
